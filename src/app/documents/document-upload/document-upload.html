<form class="upload-form" (submit)="$event.preventDefault(); onSubmit()">
  <div class="field">
    <label for="doc-file">Document (photo or PDF)</label>
    <input
      id="doc-file"
      type="file"
      accept="image/*,application/pdf"
      aria-describedby="doc-file-hint"
      (change)="onFileSelected($event)"
    >
    <p id="doc-file-hint" class="hint">Take a photo of the mail or choose an existing file.</p>
  </div>

  <fieldset class="field">
    <legend>Category</legend>
    @for (category of categories; track category.id) {
      <label class="radio-option">
        <input
          type="radio"
          name="category"
          [value]="category.id"
          [checked]="selectedCategory() === category.id"
          (change)="onCategoryChange(category.id)"
        >
        {{ category.label }}
      </label>
    }
  </fieldset>

  <button type="submit" class="submit-btn" [disabled]="!selectedFile() || isUploading()">
    {{ isUploading() ? 'Uploading…' : 'Upload' }}
  </button>

  @if (uploadProgress() !== undefined) {
    <div class="status" role="status" aria-live="polite">Uploading… {{ uploadProgress() }}%</div>
  }

  @if (errorMessage(); as error) {
    <div class="status status--error" role="alert">{{ error }}</div>
  }
</form>
